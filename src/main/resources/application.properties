spring.application.name=QNHRM

# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:quan_ly_cham_cong}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1800000

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# =========================================================
# DATABASE INITIALIZATION
# =========================================================

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# =========================================================
# THYMELEAF / STATIC RESOURCES
# =========================================================

spring.thymeleaf.cache=true
spring.web.resources.cache.period=7d

# =========================================================
# SERVER / RAILWAY
# =========================================================

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
server.compression.min-response-size=1024

# =========================================================
# SESSION / SECURITY COOKIE
# =========================================================

server.servlet.session.timeout=30m
server.servlet.session.cookie.name=QNHRM_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# =========================================================
# ERROR HANDLING
# =========================================================

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# =========================================================
# INITIAL ADMIN (OPTIONAL - CREATE ONLY WHEN ENV VARS ARE SET)
# =========================================================

app.bootstrap.admin.username=${APP_ADMIN_USERNAME:}
app.bootstrap.admin.password=${APP_ADMIN_PASSWORD:}
