<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu | QNHRM</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/png" href="/images/favicon.png">
</head>
<body>
<div class="password-layout">
    <div class="password-card">
        <div class="password-head"><img class="brand-logo-img password-logo-img" th:src="@{/images/qnhrm-logo.png}" alt="QNHRM"><div><h1>Đổi mật khẩu</h1><p>Cập nhật mật khẩu đăng nhập của tài khoản</p></div></div>
        <div class="password-user">Tài khoản <strong th:text="${employee.username}">admin</strong> · <span th:text="${employee.fullName}">Quản trị viên</span></div>
        <div th:if="${error != null}" class="flash flash-error" th:text="${error}">Có lỗi xảy ra.</div>
        <div th:if="${success != null}" class="flash flash-success" th:text="${success}">Đổi mật khẩu thành công.</div>
        <form method="post" th:action="@{/doi-mat-khau}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field" style="margin-bottom:14px"><label>Mật khẩu hiện tại</label><input class="control" type="password" name="currentPassword" autocomplete="current-password" required></div>
            <div class="field" style="margin-bottom:14px"><label>Mật khẩu mới</label><input class="control" type="password" name="newPassword" minlength="8" autocomplete="new-password" required><div class="helper">Ít nhất 8 ký tự.</div></div>
            <div class="field"><label>Xác nhận mật khẩu mới</label><input class="control" type="password" name="confirmPassword" minlength="8" autocomplete="new-password" required></div>
            <div class="form-actions"><a class="btn btn-secondary" href="/">Quay lại</a><button class="btn btn-primary" type="submit">Đổi mật khẩu</button></div>
        </form>
    </div>
</div>
</body>
</html>
